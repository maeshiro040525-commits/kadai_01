<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system, sans-serif">
  <rect width="600" height="400" fill="#fff" stroke="#e5e5e5" rx="8"/>

  <!-- ヘッダー -->
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#222">賃金判断</text>
  <text x="30" y="62" font-size="12" fill="#888">前年比 + 賃上げシミュレーション</text>

  <!-- グラフ -->
  <g transform="translate(50, 100)">
    <line x1="0" y1="220" x2="500" y2="220" stroke="#ddd"/>
    <line x1="0" y1="20" x2="0" y2="220" stroke="#ddd"/>

    <!-- グリッド線 -->
    <line x1="0" y1="160" x2="500" y2="160" stroke="#f0f0f0"/>
    <line x1="0" y1="100" x2="500" y2="100" stroke="#f0f0f0"/>
    <line x1="0" y1="40" x2="500" y2="40" stroke="#f0f0f0"/>

    <!-- 実績折れ線 -->
    <polyline points="20,180 100,170 180,160 260,150 340,140 420,130" fill="none" stroke="#222" stroke-width="2.5"/>

    <!-- シミュレーション折れ線 -->
    <polyline points="420,130 470,90 490,60" fill="none" stroke="#ffd61a" stroke-width="3" stroke-dasharray="6,3"/>

    <!-- 点 -->
    <g fill="#222">
      <circle cx="20" cy="180" r="4"/>
      <circle cx="100" cy="170" r="4"/>
      <circle cx="180" cy="160" r="4"/>
      <circle cx="260" cy="150" r="4"/>
      <circle cx="340" cy="140" r="4"/>
      <circle cx="420" cy="130" r="4"/>
    </g>

    <g fill="#ffd61a">
      <circle cx="470" cy="90" r="4"/>
      <circle cx="490" cy="60" r="4"/>
    </g>

    <!-- 月ラベル -->
    <g fill="#888" font-size="10">
      <text x="20" y="240" text-anchor="middle">4月</text>
      <text x="100" y="240" text-anchor="middle">5月</text>
      <text x="180" y="240" text-anchor="middle">6月</text>
      <text x="260" y="240" text-anchor="middle">7月</text>
      <text x="340" y="240" text-anchor="middle">8月</text>
      <text x="420" y="240" text-anchor="middle">9月</text>
      <text x="470" y="240" text-anchor="middle" fill="#7a5500" font-weight="bold">If +5K</text>
    </g>
  </g>

  <!-- 注意 -->
  <g transform="translate(30, 360)">
    <rect width="540" height="30" fill="#fffce5" rx="4"/>
    <text x="20" y="20" font-size="12" fill="#7a5500">💡 全員 +5,000円なら、年度予算内で実現可能</text>
  </g>
</svg>
