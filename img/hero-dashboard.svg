<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#fff" rx="8"/>
  <!-- ヘッダー -->
  <rect x="0" y="0" width="1200" height="60" fill="#2c2c2c"/>
  <text x="30" y="38" fill="#fff" font-size="20" font-weight="bold">ChildcareOS</text>
  <circle cx="1140" cy="30" r="14" fill="#5b8a72"/>
  <text x="1140" y="35" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">M</text>

  <!-- サイドナビ -->
  <rect x="0" y="60" width="200" height="740" fill="#f7f9fb"/>
  <rect x="0" y="80" width="200" height="40" fill="#fff"/>
  <rect x="0" y="80" width="3" height="40" fill="#ffd61a"/>
  <text x="20" y="105" fill="#222" font-size="14" font-weight="bold">職員配置</text>
  <text x="20" y="145" fill="#666" font-size="14">賃金判断</text>
  <text x="20" y="180" fill="#666" font-size="14">管理会計</text>
  <text x="20" y="215" fill="#999" font-size="14">レポート</text>
  <text x="20" y="250" fill="#999" font-size="14">設定</text>

  <!-- メインエリア -->
  <text x="230" y="100" fill="#222" font-size="22" font-weight="bold">職員配置 / 2026年5月</text>
  <text x="230" y="125" fill="#888" font-size="13">最終更新: 5/9 09:30</text>

  <!-- KPIカード3つ -->
  <g transform="translate(230, 145)">
    <rect width="280" height="120" fill="#fff" stroke="#e5e5e5" rx="8"/>
    <text x="20" y="35" fill="#888" font-size="13">必要人員</text>
    <text x="20" y="85" fill="#222" font-size="36" font-weight="bold">42</text>
    <text x="80" y="85" fill="#888" font-size="14">人</text>
  </g>
  <g transform="translate(530, 145)">
    <rect width="280" height="120" fill="#fff" stroke="#e5e5e5" rx="8"/>
    <text x="20" y="35" fill="#888" font-size="13">配置済み</text>
    <text x="20" y="85" fill="#222" font-size="36" font-weight="bold">38</text>
    <text x="80" y="85" fill="#888" font-size="14">人</text>
  </g>
  <g transform="translate(830, 145)">
    <rect width="280" height="120" fill="#fffce5" stroke="#ffd61a" stroke-width="2" rx="8"/>
    <text x="20" y="35" fill="#7a6500" font-size="13" font-weight="bold">⚠ 不足</text>
    <text x="20" y="85" fill="#7a5500" font-size="36" font-weight="bold">4</text>
    <text x="60" y="85" fill="#7a5500" font-size="14">人</text>
    <text x="20" y="105" fill="#7a5500" font-size="11">9:00-10:00帯</text>
  </g>

  <!-- グラフエリア -->
  <g transform="translate(230, 295)">
    <rect width="880" height="370" fill="#fff" stroke="#e5e5e5" rx="8"/>
    <text x="20" y="35" fill="#222" font-size="16" font-weight="bold">時間帯別 配置状況</text>
    <text x="20" y="55" fill="#888" font-size="12">緑＝充足、黄＝不足</text>

    <!-- 軸 -->
    <line x1="60" y1="310" x2="850" y2="310" stroke="#ddd"/>
    <line x1="60" y1="90" x2="60" y2="310" stroke="#ddd"/>

    <!-- 棒グラフ -->
    <g fill="#5b8a72">
      <rect x="90" y="200" width="60" height="110"/>
      <rect x="170" y="180" width="60" height="130"/>
      <rect x="250" y="120" width="60" height="190"/>
      <rect x="330" y="100" width="60" height="210"/>
      <rect x="410" y="140" width="60" height="170"/>
      <rect x="490" y="160" width="60" height="150"/>
      <rect x="570" y="180" width="60" height="130"/>
      <rect x="650" y="220" width="60" height="90"/>
      <rect x="730" y="250" width="60" height="60"/>
    </g>

    <!-- 不足部分（黄色積み上げ） -->
    <g fill="#ffd61a">
      <rect x="250" y="95" width="60" height="25"/>
      <rect x="330" y="75" width="60" height="25"/>
    </g>

    <!-- 時間ラベル -->
    <g fill="#888" font-size="11">
      <text x="120" y="330" text-anchor="middle">7:00</text>
      <text x="200" y="330" text-anchor="middle">8:00</text>
      <text x="280" y="330" text-anchor="middle">9:00</text>
      <text x="360" y="330" text-anchor="middle">10:00</text>
      <text x="440" y="330" text-anchor="middle">11:00</text>
      <text x="520" y="330" text-anchor="middle">12:00</text>
      <text x="600" y="330" text-anchor="middle">13:00</text>
      <text x="680" y="330" text-anchor="middle">14:00</text>
      <text x="760" y="330" text-anchor="middle">15:00</text>
    </g>
  </g>

  <!-- アクション提案 -->
  <g transform="translate(230, 695)">
    <rect width="880" height="80" fill="#fffce5" rx="8"/>
    <text x="20" y="32" fill="#7a5500" font-size="14" font-weight="bold">💡 提案アクション</text>
    <text x="20" y="58" fill="#222" font-size="13">9-10時帯に短時間パートを2名配置すると、月¥48,000の追加コストで充足可能</text>
  </g>
</svg>
